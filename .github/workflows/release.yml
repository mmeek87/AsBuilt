# Publishes a release: tags vX.Y.Z, moves the major tag (vX) to it, and
# creates the GitHub release with that version's CHANGELOG section.
# Run it from Actions → Release → Run workflow, after the version is merged.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.0.0 (must match package.json)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a version like 1.0.0" >&2; exit 1; }
          [ "$(node -p 'require("./package.json").version')" = "$VERSION" ] || { echo "package.json isn't $VERSION" >&2; exit 1; }
          grep -q "^## $VERSION " CHANGELOG.md || { echo "CHANGELOG.md has no $VERSION section" >&2; exit 1; }
          ! git rev-parse "v$VERSION" >/dev/null 2>&1 || { echo "v$VERSION already exists" >&2; exit 1; }
      - name: Tag and publish
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          major="v${VERSION%%.*}"
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > notes.md
          git tag "v$VERSION"
          git tag -f "$major"
          git push origin "v$VERSION"
          git push -f origin "$major"
          gh release create "v$VERSION" --title "AsBuilt $VERSION" --notes-file notes.md --verify-tag
