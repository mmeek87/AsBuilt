name: AsBuilt verify
description: Check that a preview does what you intended, with desktop and mobile screenshots for every check. No AI calls, no cost.
author: Mel Meek
branding:
  icon: check-square
  color: green

inputs:
  url:
    description: The https preview address to check (for example from a Vercel deployment), or "sample" for the bundled demo page.
    required: true
  plan:
    description: A reviewed plan file, or a folder of them (one JSON file per feature, up to 60). Every PR rechecks every feature, so earlier features are protected from regressions.
    default: .asbuilt
  comment:
    description: Post (and update) one summary comment on the pull request. Needs "pull-requests write" permission.
    default: "true"
  fail-on-mismatch:
    description: Mark the check as failed when AsBuilt observes a mismatch. "Not verified" results never fail the check; they show as warnings.
    default: "true"
  timeout-minutes:
    description: Stop and report "interrupted" after this many minutes. Nothing is marked passed on timeout. Leave empty for about two minutes per check file (at least 10).
    default: ""
  vercel-bypass-secret:
    description: For Vercel previews with Deployment Protection. Store the project's "Protection Bypass for Automation" secret as a repository secret and pass it here. Sent only to the preview's own address.
    default: ""
  test-email:
    description: Email of a dedicated test account, for plans with a signIn step. Pass it from a repository secret. Never use a real account.
    default: ""
  test-password:
    description: Password of that test account, from a repository secret. Typed only into the preview's own sign-in page and masked in screenshots.
    default: ""
  test-totp-secret:
    description: Only for a test account with two-step sign-in (for example a test admin). The authenticator setup key (the text key shown when adding the account to an authenticator app), from a repository secret. AsBuilt makes the current code from it; use it only for a dedicated test account.
    default: ""
  second-totp-secret:
    description: The same, for the second test account.
    default: ""
  second-email:
    description: For check files with a secondSignIn (for example a store that fulfills the order). Email of a second dedicated test account, from a repository secret.
    default: ""
  second-password:
    description: Password of the second test account, from a repository secret. Typed only into the preview's own sign-in page.
    default: ""
  allow-test-actions:
    description: 'Only for workflows that check a test site. Lets check files that list approved "testActions" add to cart, go through checkout and take other order steps, and only while the page shows the check''s test-site marker. Never turn this on for a workflow that can reach your live site.'
    default: "false"
  github-token:
    description: Used only to find the pull request and post the comment.
    default: ${{ github.token }}

outputs:
  status:
    description: complete, interrupted or failed
    value: ${{ steps.verify.outputs.status }}
  passed:
    value: ${{ steps.verify.outputs.passed }}
    description: Number of passed checks (desktop and mobile counted separately)
  failed:
    value: ${{ steps.verify.outputs.failed }}
    description: Number of observed mismatches
  not-verified:
    value: ${{ steps.verify.outputs.not-verified }}
    description: Number of checks AsBuilt couldn't verify
  results-dir:
    value: ${{ steps.verify.outputs.results-dir }}
    description: Folder with report.json and screenshots

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install AsBuilt and its browser
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm exec playwright install --with-deps chromium
    - name: Verify
      id: verify
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_PLAN: ${{ inputs.plan }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        ASBUILT_VERCEL_BYPASS_SECRET: ${{ inputs.vercel-bypass-secret }}
        ASBUILT_TEST_EMAIL: ${{ inputs.test-email }}
        ASBUILT_TEST_PASSWORD: ${{ inputs.test-password }}
        ASBUILT_ALLOW_TEST_ACTIONS: ${{ inputs.allow-test-actions }}
        ASBUILT_SECOND_EMAIL: ${{ inputs.second-email }}
        ASBUILT_SECOND_PASSWORD: ${{ inputs.second-password }}
        ASBUILT_TEST_TOTP: ${{ inputs.test-totp-secret }}
        ASBUILT_SECOND_TOTP: ${{ inputs.second-totp-secret }}
      run: node --import "$GITHUB_ACTION_PATH/node_modules/tsx/dist/loader.mjs" "$GITHUB_ACTION_PATH/server/action.ts"
    - name: Save screenshots and report
      id: upload
      if: always() && steps.verify.outputs.results-dir != ''
      # Best effort: a full storage quota must never hide or fail the results.
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: asbuilt-evidence
        path: ${{ steps.verify.outputs.results-dir }}
        retention-days: 14
    - name: Note missing screenshots
      if: always() && steps.upload.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Screenshots couldn't be saved to this run (often because the account's Actions artifact storage is full; delete old artifacts or wait for usage to recalculate). The results above are unaffected."
        printf '\n> **Screenshots weren'\''t saved for this run.** GitHub refused the upload, usually because Actions artifact storage is full. Results are unaffected. Delete old artifacts in your repositories to free space.\n' >> "$GITHUB_STEP_SUMMARY"
    - name: Fail on observed mismatch
      if: steps.verify.outputs.mismatch == 'true' && inputs.fail-on-mismatch == 'true'
      shell: bash
      run: |
        echo "::error::AsBuilt observed at least one mismatch. See the job summary and screenshots."
        exit 1
