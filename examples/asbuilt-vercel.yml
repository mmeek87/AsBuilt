# Copy to .github/workflows/asbuilt.yml in your app's repository.
# Runs after Vercel finishes a preview deployment for a pull request,
# checks it against your .asbuilt/*.json checks, and comments on the PR.
# Free on public repositories; uses your included minutes on private ones.
name: AsBuilt

on: deployment_status

permissions:
  contents: read
  pull-requests: write # to post the summary comment
  deployments: read

jobs:
  verify:
    # Only successful preview deployments. Vercel names production
    # deployments "Production"; check yours in the Deployments tab.
    if: >-
      github.event.deployment_status.state == 'success' &&
      !contains(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: mmeek87/AsBuilt@v1
        with:
          url: ${{ github.event.deployment_status.environment_url }}
          # Secrets you haven't added yet are simply empty: checks that need
          # them are listed under "Needs setup" with the fix. Add a secret and
          # the next run uses it; nothing to edit here.
          # Create them with `gh secret set NAME` (it asks for the value) or in
          # GitHub: Settings → Secrets and variables → Actions.
          vercel-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          test-email: ${{ secrets.ASBUILT_TEST_EMAIL }}
          test-password: ${{ secrets.ASBUILT_TEST_PASSWORD }}
          test-totp-secret: ${{ secrets.ASBUILT_TEST_TOTP }}
          second-email: ${{ secrets.ASBUILT_SECOND_EMAIL }}
          second-password: ${{ secrets.ASBUILT_SECOND_PASSWORD }}
          second-totp-secret: ${{ secrets.ASBUILT_SECOND_TOTP }}
          # The one deliberate switch: only if this workflow ever reaches just
          # your test site (test data, test payments), never your live site.
          # allow-test-actions: true
