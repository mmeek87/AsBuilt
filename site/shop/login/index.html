<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in</title><style>body{font:18px/1.5 system-ui;color:#1d2b28;background:#f7f6f0;margin:0;padding:32px 20px}main{max-width:620px;margin:auto}small{letter-spacing:.08em;color:#5a6662}a,button{display:inline-block;margin:6px 8px 6px 0;padding:10px 14px;font:inherit;border-radius:6px}button{background:#245d49;color:#fff;border:0}label{display:block;margin:14px 0 4px}input{display:block;padding:10px;font:inherit;width:100%;max-width:320px}</style><main><small>FICTIONAL TEST SHOP · DEMO ACCOUNT ONLY</small><h1>Sign in</h1><p>This page tests AsBuilt's sign-in. The demo password is public on purpose: <code>maple-demo-only</code>.</p><form id="f"><label for="e">Email</label><input id="e" type="email" autocomplete="username"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><p id="msg" role="alert"></p><button>Sign in</button></form><script>document.getElementById("f").addEventListener("submit",function(ev){ev.preventDefault();if(document.getElementById("p").value==="maple-demo-only"&&document.getElementById("e").value.includes("@")){sessionStorage.setItem("signedIn","yes");location.href="../account/";}else{document.getElementById("msg").textContent="Wrong email or password.";}});</script></main></html>
